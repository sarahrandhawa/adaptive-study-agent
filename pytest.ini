[pytest]
# course/ holds archived course exercises (e.g. course/test_all_stages.py is a
# standalone smoke script that needs live servers + OpenAI). Keep it on disk but
# out of normal discovery. Run it directly with: python course/test_all_stages.py
norecursedirs = course evals .* venv .venv __pycache__ build dist
pythonpath = . tests
# importlib mode lets test_adaptive.py (root) and tests/test_adaptive.py coexist.
addopts = -ra --strict-markers --import-mode=importlib
markers =
    integration: needs live external services (Postgres/Pinecone/OpenAI). Skipped unless RUN_INTEGRATION=1.
    regression: reproduces a previously confirmed bug; guards its fix (see TESTING_REPORT.md).
    postgres: needs a LOCAL disposable Postgres via TEST_DATABASE_URL. Skipped otherwise.
